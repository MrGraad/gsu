<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расписание GSU</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">

  <!-- ==================== ЭКРАН 1: ГЛАВНОЕ ОКНО (ПЛИТКИ) ==================== -->
  <div id="homeView" class="min-h-screen flex flex-col pb-24">
    <header class="p-4 max-w-2xl w-full mx-auto flex items-center justify-between">
      <h1 class="font-bold text-xl">FLAX GSU</h1>
      <button onclick="toggleTheme()" class="p-2 border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-xl" title="Сменить тему">
        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      </button>
    </header>

    <!-- Сетка 2x2 (вниз расширяется автоматически) -->
    <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex items-center">
      <div id="homeTilesGrid" class="grid grid-cols-2 gap-4 w-full"></div>
    </main>

    <!-- Закруглённая нижняя панель в стиле основного расписания -->
    <nav class="fixed bottom-4 left-4 right-4 z-40">
      <div id="bottomNavBar" class="max-w-md mx-auto grid grid-cols-4 divide-x divide-slate-200 dark:divide-slate-800 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md shadow-lg overflow-hidden"></div>
    </nav>
  </div>

  <!-- ==================== ЭКРАН 2: РАСПИСАНИЕ (скрыт при входе) ==================== -->
  <div id="scheduleView" class="hidden min-h-screen bg-white dark:bg-slate-950">
    <header class="border-b border-slate-200 dark:border-slate-800 p-3 sm:p-4">
      <div class="max-w-5xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            
            <!-- Кнопка возврата на главный экран -->
            <button onclick="openView('home')" class="p-2 border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition shrink-0" title="На главную">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>

            <div class="relative shrink-0" id="menuWrapper">
              <button id="menuToggle" class="p-2 border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Разделы">
                <i data-lucide="menu" class="w-4 h-4"></i>
              </button>
              <div id="menuDropdown" class="hidden absolute left-0 mt-2 w-56 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-lg py-1.5 z-50"></div>
            </div>

            <h2 class="font-bold text-base sm:text-lg truncate">FLAX GSU</h2>
            <span id="currentRoleBadge" class="shrink-0 text-[11px] sm:text-xs px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium">
              Студенты
            </span>
          </div>

          <button onclick="toggleTheme()" class="sm:hidden p-2 border border-slate-300 dark:border-slate-700 rounded-lg shrink-0" title="Сменить тему">
            <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          </button>
        </div>

        <div class="grid grid-cols-2 sm:flex sm:items-center gap-2 sm:gap-3">
          <div class="grid grid-cols-2 sm:inline-flex rounded-lg border border-slate-300 dark:border-slate-700 p-0.5 text-xs font-medium">
            <button id="weekTopBtn" onclick="changeWeek('top')" class="px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-md transition text-center truncate">
              Над<span class="hidden sm:inline"> чертой</span>
            </button>
            <button id="weekBottomBtn" onclick="changeWeek('bottom')" class="px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-md transition text-center truncate">
              Под<span class="hidden sm:inline"> чертой</span>
            </button>
          </div>

          <select id="groupSelect" class="w-full sm:w-auto border border-slate-300 dark:border-slate-700 bg-transparent dark:bg-slate-950 rounded-lg px-2.5 sm:px-3 py-1.5 text-sm truncate"></select>

          <button id="themeToggle" onclick="toggleTheme()" class="hidden sm:block p-2 border border-slate-300 dark:border-slate-700 rounded-lg shrink-0" title="Сменить тему">
            <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
            <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          </button>
        </div>

      </div>
    </header>

    <main class="max-w-5xl mx-auto p-3 sm:p-4 space-y-4 sm:space-y-6">
      <input id="searchInput" type="text" placeholder="Поиск..." 
             class="w-full sm:max-w-md border border-slate-300 dark:border-slate-700 bg-transparent rounded-lg px-3 py-2 text-sm">
      <nav id="dayTabs" class="flex gap-1.5 sm:gap-2 overflow-x-auto pb-1"></nav>
      <section id="scheduleContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4"></section>
    </main>
  </div>

  <!-- Модальное окно для Настроек и кнопок-заглушек -->
  <div id="infoModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" onclick="closeModal()">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 max-w-sm w-full space-y-4 shadow-xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between">
        <h3 id="modalTitle" class="font-bold text-base">Заголовок</h3>
        <button onclick="closeModal()" class="p-1 text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div id="modalBody" class="text-sm text-slate-600 dark:text-slate-300"></div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
