<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Расписание GSU</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen">

  <!-- ==================== 1. ШАПКА (УПРАВЛЕНИЕ) ==================== -->
  <header class="border-b border-slate-200 dark:border-slate-800 p-3 sm:p-4">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      
      <!-- ВЕРХНЯЯ ЛИНИЯ: Левый блок (Меню + Название) и Кнопка темы на мобильных -->
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          
          <!-- Кнопка меню (3 полоски в квадрате) СЛЕВА -->
          <div class="relative shrink-0" id="menuWrapper">
            <button id="menuToggle" class="p-2 border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="Разделы">
              <i data-lucide="menu" class="w-4 h-4"></i>
            </button>

            <!-- Выпадающий список (прижат к левому краю: left-0) -->
            <div id="menuDropdown" class="hidden absolute left-0 mt-2 w-56 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-lg py-1.5 z-50">
              <!-- Сюда JS подставит пункты меню -->
            </div>
          </div>

          <!-- Название проекта + бейдж текущего режима -->
          <h1 class="font-bold text-base sm:text-lg truncate">FLAX GSU</h1>
          <span id="currentRoleBadge" class="shrink-0 text-[11px] sm:text-xs px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium">
            Студенты
          </span>
        </div>

        <!-- Переключатель темы (на телефоне стоит в правом верхнем углу, на ПК прячется сюда и показывается в правом блоке) -->
        <button id="themeToggleMobile" onclick="document.getElementById('themeToggle').click()" class="sm:hidden p-2 border border-slate-300 dark:border-slate-700 rounded-lg shrink-0" title="Сменить тему">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>
      </div>

      <!-- НИЖНЯЯ ЛИНИЯ НА ТЕЛЕФОНЕ / ПРАВЫЙ БЛОК НА ПК -->
      <div class="grid grid-cols-2 sm:flex sm:items-center gap-2 sm:gap-3">
        
        <!-- Переключатель недели: на телефоне "Над / Под", на ПК "Над чертой / Под чертой" -->
        <div class="grid grid-cols-2 sm:inline-flex rounded-lg border border-slate-300 dark:border-slate-700 p-0.5 text-xs font-medium">
          <button id="weekTopBtn" onclick="changeWeek('top')" class="px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-md transition text-center truncate">
            Над<span class="hidden sm:inline"> чертой</span>
          </button>
          <button id="weekBottomBtn" onclick="changeWeek('bottom')" class="px-2 sm:px-2.5 py-1.5 sm:py-1 rounded-md transition text-center truncate">
            Под<span class="hidden sm:inline"> чертой</span>
          </button>
        </div>

        <!-- Выбор группы / преподавателя (занимает всю правую половину на телефоне) -->
        <select id="groupSelect" class="w-full sm:w-auto border border-slate-300 dark:border-slate-700 bg-transparent dark:bg-slate-950 rounded-lg px-2.5 sm:px-3 py-1.5 text-sm truncate"></select>

        <!-- Основной переключатель темы (виден на планшетах и ПК) -->
        <button id="themeToggle" class="hidden sm:block p-2 border border-slate-300 dark:border-slate-700 rounded-lg shrink-0" title="Сменить тему">
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- ==================== 2. ОСНОВНАЯ ЧАСТЬ ==================== -->
  <main class="max-w-5xl mx-auto p-3 sm:p-4 space-y-4 sm:space-y-6">

    <!-- Поиск на телефоне занимает всю ширину (w-full), на ПК ограничен max-w-md -->
    <input id="searchInput" type="text" placeholder="Поиск..." 
           class="w-full sm:max-w-md border border-slate-300 dark:border-slate-700 bg-transparent rounded-lg px-3 py-2 text-sm">

    <!-- Кнопки дней недели (равномерно растягиваются на телефоне) -->
    <nav id="dayTabs" class="flex gap-1.5 sm:gap-2 overflow-x-auto pb-1"></nav>

    <!-- Карточки пар (1 колонка на телефоне, 2 на планшете, 3 на ПК) -->
    <section id="scheduleContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4"></section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
